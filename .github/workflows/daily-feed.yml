name: 논문 피드 수집

# GitHub 서버가 매일 11:20 KST 에 Hugging Face Daily Papers 에서 최근 14일치 논문을
# 받아 latest.json 을 갱신한다. 요약을 쓰는 클라우드 루틴(12:00 KST)이 이 파일을 읽는다.
on:
  schedule:
    - cron: "20 2 * * *"   # 02:20 UTC = 11:20 KST
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 피드 수집
        run: node scripts/fetch-feed.mjs
      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json history
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "feed $(TZ=Asia/Seoul date +%F)"
            git push
          fi
